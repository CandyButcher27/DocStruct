name: bench-setup
description: Python 3.11 with the pinned CPU benchmark stack used by the review runs.
inputs:
  extra:
    description: extra packages to install (e.g. docling)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q libgl1 poppler-utils
        pip install uv
        uv pip install --system torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
        uv pip install --system -c .github/bench-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -e ".[retrieval,benchmark]" "unstructured[pdf]" unstructured-inference llama-index-core ${{ inputs.extra }}
        python -c "import torch, transformers; print(torch.__version__, transformers.__version__)"
        mkdir -p "$NLTK_DATA" && chmod 700 "$NLTK_DATA"
        python -m nltk.downloader -d "$NLTK_DATA" stopwords punkt_tab
