name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + light benchmark extras)
        run: |
          python -m pip install --upgrade pip
          # Retrieval (chromadb, sentence-transformers) and model (ultralytics)
          # extras are intentionally omitted; those tests self-skip via find_spec.
          pip install -e ".[dev,benchmark]" pymupdf
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
