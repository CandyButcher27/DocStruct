[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docstruct"
version = "0.4.0"
description = "Local, deterministic, structure-aware PDF text extraction and chunking for RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryaman Srivastava" }]
keywords = ["pdf", "rag", "layout-analysis", "chunking", "document-ai", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pdfplumber>=0.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
# ModelDetector rasterizes pages with PyMuPDF (fitz) before YOLO inference.
model = ["ultralytics>=8.0", "pymupdf>=1.24"]
retrieval = ["chromadb>=0.5", "sentence-transformers>=3.0"]
viz = ["pymupdf>=1.24"]
# The eval LLM client is stdlib-only (urllib against any OpenAI-compatible
# endpoint), so gold generation needs no extra package — only an API key.
eval = []
benchmark = ["langchain-text-splitters>=0.3", "pymupdf4llm>=0.0.17", "rank-bm25>=0.2"]
benchmark-heavy = ["unstructured[pdf]>=0.15", "docling>=2.0"]
dev = ["pytest>=8.0"]
all = [
    "ultralytics>=8.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "langchain-text-splitters>=0.3",
    "pymupdf4llm>=0.0.17",
    "rank-bm25>=0.2",
    "pytest>=8.0",
]

[project.scripts]
docstruct = "docstruct.cli:main"

[project.urls]
Homepage = "https://github.com/CandyButcher27/DocStruct"
Repository = "https://github.com/CandyButcher27/DocStruct"

[tool.setuptools.packages.find]
include = ["docstruct*"]
exclude = ["tests*", "data*", "weights*"]

[tool.setuptools.package-data]
docstruct = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
